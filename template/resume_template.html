<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名 - 目标岗位</title>
    <!-- 网络字体不可用时自动回落微软雅黑,排版不受影响 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-size: 9pt; line-height: 1.35; color: #333; background: white; }
        @page { size: A4; margin: 0.85cm 1.3cm; }   /* 【主色①】按版本替换 */
        .resume { max-width: 100%; }

        /* 求职意向条 */
        .job-target { background: #2c5282; color: #fff; padding: 4px 10px; border-radius: 3px; font-size: 9.5pt; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; }
        .job-target .label { font-weight: 700; letter-spacing: 1px; }
        .job-target .position { font-weight: 500; }
        .job-target .tagline { font-size: 8pt; opacity: 0.92; }

        /* 头部(照片与 HTML 同目录,相对引用 photo.jpg) */
        .header { display: flex; align-items: center; padding-bottom: 5px; border-bottom: 2px solid #2c5282; margin-bottom: 7px; }
        .photo { width: 80px; height: 104px; object-fit: cover; border: 1px solid #ccc; margin-left: 14px; flex-shrink: 0; }
        .header-info { flex: 1; }
        .name { font-size: 19pt; font-weight: 700; color: #2c5282; margin-bottom: 2px; letter-spacing: 3px; }
        .personal-info { font-size: 9pt; color: #555; margin-bottom: 2px; }
        .contact-info { font-size: 9pt; color: #555; }
        .contact-info span { margin: 0 6px; }
        .contact-info .divider { color: #ccc; }

        /* 模块 */
        .section { margin-bottom: 5px; }
        .section-title { font-size: 10.5pt; font-weight: 700; color: #2c5282; border-bottom: 1px solid #2c5282; padding-bottom: 1px; margin-bottom: 3px; display: flex; align-items: center; }
        .section-title::before { content: ''; width: 3px; height: 11px; background: #2c5282; margin-right: 5px; }

        .highlight { color: #2c5282; font-weight: 500; }   /* 量化数字高亮 */

        /* 实习/项目条目 */
        .exp-item { margin-bottom: 4px; }
        .exp-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
        .exp-company { font-weight: 700; font-size: 9.5pt; color: #333; }
        .exp-position { font-size: 9pt; color: #555; margin-left: 5px; }
        .exp-time { font-size: 8.5pt; color: #666; }
        .exp-desc { font-size: 9pt; color: #444; }
        .exp-desc ul { list-style: none; padding-left: 0; }
        .exp-desc li { position: relative; padding-left: 9px; line-height: 1.35; margin-bottom: 1px; }
        .exp-desc li::before { content: '\2022'; position: absolute; left: 0; color: #2c5282; font-weight: bold; }

        /* 技术栈标签行 —— 兼作 STAR chip(背景/方法/结果) */
        .tech-stack { font-size: 8.5pt; color: #2c5282; font-weight: 500; margin-bottom: 2px; line-height: 1.4; }
        .tech-stack::before { content: '\25B8'; margin-right: 4px; font-size: 7pt; }
        .tech-tag { display: inline-block; background: #e8f0f8; color: #2c5282; padding: 0px 3px; border-radius: 2px; font-size: 8pt; margin-right: 2px; }

        .proj-item { margin-bottom: 3px; }
        .proj-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1px; }
        .proj-name { font-weight: 700; font-size: 9.5pt; color: #333; }
        .proj-time { font-size: 8.5pt; color: #666; }
        .proj-role { font-size: 8.5pt; color: #555; margin-bottom: 1px; }
        .proj-desc { font-size: 9pt; color: #444; }
        .proj-desc ul { list-style: none; padding-left: 0; }
        .proj-desc li { position: relative; padding-left: 9px; line-height: 1.35; margin-bottom: 1px; }
        .proj-desc li::before { content: '\2022'; position: absolute; left: 0; color: #2c5282; font-weight: bold; }

        /* 技能 */
        .skills-grid { display: grid; grid-template-columns: 88px 1fr; gap: 2px 8px; font-size: 9pt; }
        .skill-category { font-weight: 600; color: #555; }
        .skill-content { color: #444; }

        /* 获奖 */
        .awards-list { font-size: 9pt; color: #444; line-height: 1.4; }
        .awards-list li { position: relative; padding-left: 9px; list-style: none; }
        .awards-list li::before { content: '\2022'; position: absolute; left: 0; color: #2c5282; font-weight: bold; }
        .award-level { color: #2c5282; font-weight: 500; }

        /* 溢出压页时由 export_autofit.py 自动注入:
           /*AUTO-FIT*/ .resume{zoom:0.95}  — 勿手写 */
    </style>
</head>
<body>
    <div class="resume">
        <!-- 求职意向 -->
        <div class="job-target">
            <span><span class="label">求职意向</span>　<span class="position">目标岗位名称</span></span>
            <span class="tagline">关键词一 · 关键词二 · 关键词三</span>
        </div>

        <!-- 头部 -->
        <div class="header">
            <div class="header-info">
                <h1 class="name">你的姓名</h1>
                <div class="personal-info">性别 | 年龄 | 学历</div>
                <div class="contact-info">
                    <span>手机号</span><span class="divider">|</span>
                    <span>邮箱</span>
                </div>
            </div>
            <img class="photo" src="photo.jpg" alt="个人照片">
        </div>

        <!-- 实习经历:STAR chip 写法示例 -->
        <div class="section">
            <h2 class="section-title">实习经历</h2>
            <div class="exp-item">
                <div class="exp-header">
                    <div>
                        <span class="exp-company">公司名称</span>
                        <span class="exp-position">岗位名称</span>
                    </div>
                    <span class="exp-time">2026.01 - 至今</span>
                </div>
                <div class="exp-desc">
                    <div class="tech-stack"><span class="tech-tag">技术A</span><span class="tech-tag">技术B</span><span class="tech-tag">工具C</span> 一句话概括方向</div>
                    <ul>
                        <li><strong>经历标题(做了什么事)</strong>：<span class="tech-tag">背景</span>为什么做/要达成什么;约束或痛点是什么;<span class="tech-tag">方法</span>动词开头写具体做法(技术选型、真实决策),不展开教科书定义;<span class="tech-tag">结果</span>量化成果,<span class="highlight">数字高亮</span>(次数/小时/效率/规模),区分定性/定量验证</li>
                        <li><strong>第二条经历</strong>：同上结构;每条 2-4 行为宜</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 项目经历 / 教育经历 / 专业技能 / 竞赛获奖:按岗位调整板块顺序 -->
    </div>
</body>
</html>
